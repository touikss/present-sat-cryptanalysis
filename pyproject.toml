[project]
name = "present-sat-cryptanalysis"
version = "0.1.0"
description = "Optimal differential trail search on PRESENT via SAT encoding (Kissat, CaDiCaL)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "pypblib>=0.0.4",
    "python-sat>=1.9.dev2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=7.2.0",
    "jupyterlab",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["notebook.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
